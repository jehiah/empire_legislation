footer {

<script src="https://cdnjs.cloudflare.com/ajax/libs/FlexSearch/0.8.2/flexsearch.es5.min.js" integrity="sha512-6/HWgrv+vF1Cj3KDN0LLAI4hL4TijgvOhhZUKb6srRsbJOsrFtTyrRAP9J1JthBuZ5Dtp95suOXcrsOasfjZxg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script type="module">
const currentSession = "2025"

function diffDates(start, end) {
    // const date1 = new Date(start);
    // const date2 = new Date(end);

    // One day in milliseconds
    const oneDay = 1000 * 60 * 60 * 24;
    const oneHour = 1000 * 60 * 60;
    const oneMinute = 1000 * 60;

    // Calculating the time difference between two dates
    const diffInTime = start.getTime() - end.getTime();

    // Calculating the no. of days between two dates
    const days = Math.round(diffInTime / oneDay);
    if (days != 0) {
      return {unit:"day", units:days}
    }
    const hours = Math.round(diffInTime / oneHour);
    if (hours != 0) {
      return {unit:"hour", units:hours}
    }
    const minutes = Math.round(diffInTime / oneMinute);
    if (minutes != 0) {
      return {unit:"minute", units:minutes}
    }
    return {unit:"second", units: Math.round(diffInTime / 1000) }
}

function shortDate(d, opt) {
  return d.toLocaleString(undefined, {
    year: 'numeric',
    month: 'short',
    day: 'numeric',
    timeZone: 'America/New_York'
  })
}


const rtf = new Intl.RelativeTimeFormat("en", {
    // localeMatcher: "best fit", // other values: "lookup"
    numeric: "always", // other values: "auto"
    style: "long", // other values: "short" or "narrow"
});

// bootstrap search from URL
const urlSearchParams = new URLSearchParams(window.location.search)
document.getElementById("q").value = urlSearchParams.get("q");
const defaultSession = urlSearchParams.get("session") ? urlSearchParams.get("session") : currentSession;
document.getElementsByName("session").forEach(e => {e.checked = (e.value == defaultSession)})
if (urlSearchParams.get("type") === "resolutions") {
  document.getElementsByName("bill-type").forEach(e => {e.checked = (e.value == urlSearchParams.get("type"))})
}


function newIndex() {
  return new FlexSearch.Document({
    charset: "latin:advanced", 
    tokenize: "forward",
    document : {
      id: "SearchKey",
      index: ["PrintNo", "Title", "Summary", "LawSection", "ActClause"],
    }
  });
}
var index = {}
var lookupData = {};

window.lookupData = lookupData;
window.index = index;

// isRecentDate checks if a date is in the last 30 days
const today = (new Date()).valueOf()
function isRecentDate(d, cuttoffDays) {
  const start = today - (cuttoffDays*24*60*60*1000);
  const ms = d.valueOf()
  return start <= ms && ms <= today
}
function isDate(d) {
  return d !== "0001-01-01T00:00:00Z"
}
function compareDates(a, b) {
  return (a>b)-(a<b)
}


loadSearchIndex(defaultSession, radioSelectedValue("bill-type")).then(_ => {
  document.getElementById("search-loading").style.display = 'none';
  const q = document.getElementById("q");
  document.getElementById('search').style.display = '';

  q.addEventListener("input", onsearchupdate);
  document.getElementsByName("session").forEach(d => {
    d.addEventListener("change", onsearchupdate)
  })
  document.getElementsByName("bill-type").forEach(d => {
    d.addEventListener("change", onsearchupdate)
  })
  document.getElementById("searchform").addEventListener("submit", event => {event.preventDefault()})
  search(q.value, radioSelectedValue("session"), radioSelectedValue("bill-type"));
})

function radioSelectedValue(field) {
  const e = document.getElementsByName(field);
  for (let i = 0; i < e.length; i++) { 
    if (e[i].checked) {
      return e[i].value;
    }
  }
}

function onsearchupdate() {
  var qs = new URLSearchParams()
  const q = document.getElementById("q");
  if (q.value.length > 0) {
    qs.set("q", q.value)
  }

  const session = radioSelectedValue("session");
  if (session != currentSession) {
    qs.set("session", session)
  }

  const billType = radioSelectedValue("bill-type");
  if (billType != "bills") {
    qs.set("type", billType)
  }

  const l = qs.toString();
  history.pushState(null, document.title, l.length == 0 ? "/" : "/?" + l)

  if (index[session + billType] == undefined) {
  // clear previous results before fetch
  document.querySelector("#search-results").innerHTML = '<div class="spinner-border text-primary" role="status" ></div>';
  }

  loadSearchIndex(session, billType).then(_ => {
    search(q.value, session, billType);
  })
}

function loadSearchIndex(session, billType) {
  const key = session + billType
  if (index[key] == undefined) {
    let prefix = billType + "_"
   return fetch(`/data/${prefix}${session}.json`)
    .then(response => response.json())
    .then(d => {
      index[key] = newIndex();
      d.forEach(dd => {
        dd.SearchKey = dd.PrintNo + "-" + dd.Session
        dd.LastModifiedDt = new Date(dd.LastModified)
        index[key].add(dd);
        lookupData[dd.SearchKey] = dd
      })
    })
  } else {
    return Promise.resolve()
  }
}

function search(q, session , billType) {
  const key = session + billType
  const resultsEl = document.querySelector("#search-results");
  resultsEl.innerHTML = '';
  resultsEl.style.display = '';

  var results = index[key].search(q, 75)
  // console.log("results", results)
  var seen = {};
  var resultArray = [];
  var hasResults = false;
  results.forEach(r => {
    r.result.forEach(key => {
      if (seen[key]) {return}
      seen[key] = true;
      hasResults = true;
      resultArray.push(lookupData[key])
    })
  })
  if (!hasResults) {
    if (q !== "") {
      // add "no results"
      const p = document.createElement("p")
      p.class = "no-results"
      p.textContent = "No results"
      resultsEl.appendChild(p)
    } else {
      resultsEl.style.display = 'none';
    }
  } else {
      const p = document.createElement("p")
      p.class="search-summary"
      p.innerHTML =  `${resultArray.length} result${resultArray.length > 1 ? "s"  : ""} for <span class='search-term'></span>`
      resultsEl.appendChild(p)
      document.querySelector(".search-term").textContent = "\"" + q +"\""

    resultArray.sort((a, b) => {return a.PrintNo.localeCompare(b.PrintNo)})
    resultArray.forEach(d => addSearchResult(d, billType))
  }
}
function addSearchResult(row, billType) {
    // console.log("addResult", row)
    var target = document.querySelector("#search-results");
    var template = document.querySelector('#legislation-template');
    var clone = template.content.cloneNode(true);
    if (row.Status == "Withdrawn") {
      clone.querySelectorAll(".legislation")[0].className += " status-withdrawn";
    }
    const senateLink = clone.querySelector(".file-link-senate")
    const assemblyLink = clone.querySelector(".file-link-assembly")
    const senateBadge = clone.querySelector(".file-senate")
    const assemblyBadge = clone.querySelector(".file-assembly")

    if (row.Chamber == "SENATE") {
      senateLink.href = buildURL(row.PrintNo, row.Session, row.Chamber);
      senateBadge.textContent = row.PrintNo;
      senateLink.classList.remove("empty")
    } else {
      assemblyLink.href = buildURL(row.PrintNo, row.Session, row.Chamber);
      assemblyBadge.textContent = row.PrintNo;
      assemblyLink.classList.remove("empty")
    }
    
    if (row.SameAs ) {
      const sameAsChamber = oppositeChamber(row.Chamber);
      if (sameAsChamber == "SENATE") {
        senateLink.href = buildURL(row.SameAs, row.Session, sameAsChamber);
        senateBadge.textContent = row.SameAs;
        senateLink.classList.remove("empty")
      } else {
        assemblyLink.href = buildURL(row.SameAs, row.Session, sameAsChamber);
        assemblyBadge.textContent = row.SameAs;
        assemblyLink.classList.remove("empty")
      }
    }

    const shortSummary = (row.Summary || "").slice(0,200)
    clone.querySelectorAll(".name")[0].textContent=row.Title || shortSummary;
    // clone.querySelectorAll(".title")[0].textContent=;
    var enacted = false;
    var vetoed = false;
    var adopted = false;
    var passed = false;
    if (row.Status == "DELIVERED_TO_GOV" || row.Status == "SIGNED_BY_GOV") {
      enacted = true;
    }
    if (row.Status == "VETOED") {
      vetoed = true;
    }
    if (billType == "resolutions" && row.Status == "ADOPTED") {
      adopted = true;
    }
    const enactedEl = clone.querySelector(".status.enacted")
    enactedEl.style.display = enacted ? "" : "none";
    if (row.Status == "DELIVERED_TO_GOV") {
      enactedEl.textContent = "Delivered to Governor";
    }
    clone.querySelectorAll(".status.vetoed").forEach(e => e.style.display = vetoed ? "" : "none");
    clone.querySelectorAll(".status.adopted").forEach(e => e.style.display = adopted ? "" : "none");

    if (isRecentDate(row.LastModifiedDt, 14)) {
      const diff = diffDates(row.LastModifiedDt, new Date());
      // console.log(diff, row.LastModifiedDt)
      clone.querySelectorAll(".last-update")[0].textContent = "Updated " + rtf.format(diff.units, diff.unit)
    } else {
      clone.querySelectorAll(".last-update")[0].remove()
    }

    target.appendChild(clone);
}
function buildURL(printNo, session, chamber) {
  if (chamber == "SENATE") {
    return buildSenateURL(printNo, session)
  } else {
    return buildAssemblyURL(printNo, session)
  }
}

function oppositeChamber(chamber) {
  if (chamber == "SENATE") {
    return "ASSEMBLY"
  }
  if (chamber == "ASSEMBLY") {
    return "SENATE"
  }
  return chamber
}

function chamberFromPrintNo(printNo) {
  const prefix = (printNo || "").trim().charAt(0).toUpperCase();
  if (prefix == "S") {
    return "SENATE"
  }
  if (prefix == "A") {
    return "ASSEMBLY"
  }
  return null
}

function buildAssemblyURL(printNo, session) {
  // https://nyassembly.gov/leg/?bn=A00100&term=2025
  const q = new URLSearchParams()
  q.set("term", session)
  q.set("bn", printNo)
  return "https://nyassembly.gov/leg/?" + q.toString()
}
function buildSenateURL(printNo, session) {
  // https://www.nysenate.gov/legislation/bills/2025/s100
  return "https://www.nysenate.gov/legislation/bills/" + session + "/" + printNo
}

</script>
