name: build-index
on:
  push:
    branches:
      - master
  workflow_dispatch:
  repository_dispatch:
    types: [reindex]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout empire_legislation
      uses: actions/checkout@v7
      with:
        path: empire_legislation
    - name: Checkout ny_legislation
      uses: actions/checkout@v7
      with:
        repository: jehiah/ny_legislation
        path: ny_legislation
    - uses: actions/setup-go@v7
      with:
        go-version: 'stable'
    - name: Build Index
      run: 'cd $GITHUB_WORKSPACE/empire_legislation/scripts/build_index && go build && ./build_index'
    - name: Set up Cloud SDK
      uses: 'google-github-actions/auth@v3'
      with:
        credentials_json: '${{ secrets.GOOGLE_CREDENTIALS }}'
    - name: Upload Indexes
      uses: 'google-github-actions/upload-cloud-storage@v3'
      with:
        path: empire_legislation/build
        destination: 'empire_legislation'
        gzip: true
    - name: Upload Indexes
      uses: 'google-github-actions/upload-cloud-storage@v3'
      with:
        path: empire_legislation/www
        destination: 'empire_legislation'

